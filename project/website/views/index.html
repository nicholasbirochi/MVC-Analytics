<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sistema de Monitoramento Comportamental</title>
  <link rel="icon" href="../images/logo_blue.ico" />
  <link rel="stylesheet" href="../style/styles.css" />
</head>
<body>
  <header>
    <div class="logo_blue-titulo">
      <img src="../images/logo_blue.ico" alt="logo_blue" class="logo_blue" />
      <h1>Sistema de Monitoramento Comportamental</h1>
    </div>

    <!-- Ajuste as URLs nos data-src conforme seu backend -->
    <nav class="menu-opcoes" aria-label="Navegação principal">
      <a href="#visao-geral" data-src="http://localhost:8050/Monitoramento Comportamental" data-key="visao-geral" aria-current="page">Visão Geral</a>
      <a href="#por-area"    data-src="http://localhost:8060/Monitoramento Comportamental"   data-key="por-area">Por Área</a>
      <a href="#por-pessoa"  data-src="http://localhost:8070/Monitoramento Comportamental" data-key="por-pessoa">Por Pessoa</a>
      <a href="#relacionamento" data-src="http://localhost:8050/relacionamento" data-key="relacionamento">Relacionamento</a>
    </nav>
  </header>

  <main class="page-wrap">
    <section class="card frame-wrap" aria-label="Conteúdo dinâmico">
      <div class="frame-toolbar">
        <span>Conteúdo Dinâmico</span>
        <div class="actions">
          <button class="btn" id="reload">Recarregar</button>
        </div>
      </div>
      <iframe id="dynframe" title="Conteúdo Dinâmico" loading="lazy" referrerpolicy="no-referrer"></iframe>
    </section>
  </main>

  <footer>
    © <span id="year"></span> — Nicholas Birochi (nicholas.birochi@gmail.com)
  </footer>

  <script src="../javascript/app.js"></script>
</body>
</html>
